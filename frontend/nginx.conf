server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container (if we want to route /api through nginx)
    # Alternatively, the frontend can connect directly to the backend URL via VITE_API_URL.
    # We will support both by configuring try_files above and letting VITE_API_URL point to the API.

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
